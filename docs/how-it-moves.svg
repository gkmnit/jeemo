<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Three screens pass messages to each other with no server in between" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a8f82"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="17" font-weight="600" fill="#f26b3a">Nothing in the middle. The screens talk to each other.</text>

  <!-- three screens -->
  <g stroke="#9a8f82" stroke-width="1.25" fill="none">
    <rect x="24"  y="56" width="200" height="96" rx="10"/>
    <rect x="280" y="56" width="200" height="96" rx="10"/>
    <rect x="536" y="56" width="200" height="96" rx="10"/>
  </g>

  <g font-size="15" font-weight="600" fill="#f26b3a">
    <text x="124" y="84" text-anchor="middle">In the kitchen</text>
    <text x="380" y="84" text-anchor="middle">Outside the door</text>
    <text x="636" y="84" text-anchor="middle">At the table</text>
  </g>
  <g font-size="12.5" fill="#9a8f82">
    <text x="124" y="108" text-anchor="middle">puts up the meal</text>
    <text x="124" y="128" text-anchor="middle">reads what came back</text>
    <text x="380" y="108" text-anchor="middle">today's food, in large type</text>
    <text x="380" y="128" text-anchor="middle">and what was said yes to</text>
    <text x="636" y="108" text-anchor="middle">one tap a dish</text>
    <text x="636" y="128" text-anchor="middle">a note, or an ask</text>
  </g>

  <!-- the shared stream -->
  <rect x="24" y="236" width="712" height="70" rx="10" fill="#f26b3a" fill-opacity="0.08" stroke="#f26b3a" stroke-width="1.25"/>
  <text x="380" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#f26b3a">one shared stream of messages</text>
  <text x="380" y="288" text-anchor="middle" font-size="12.5" fill="#9a8f82">menus · ratings · requests — every machine keeps its own copy</text>

  <g stroke="#9a8f82" stroke-width="1.25" fill="none" marker-end="url(#a)">
    <path d="M124 196V236"/>
    <path d="M380 196V236"/>
    <path d="M636 196V236"/>
  </g>

  <text x="380" y="180" text-anchor="middle" font-size="12.5" fill="#9a8f82">no server, no account, no company in between &#183; unplug the internet and it still works across the building</text>
</svg>
